name: Upload Python Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/python-app.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: Publish the exact distributions validated by the quality gate
        run: uv publish -t ${{ secrets.PYPI_API_TOKEN }} dist/*
