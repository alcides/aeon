# Upload a release to PyPI after a full test gate.
#
# Publishes only on version tags (``v*``) or manual workflow_dispatch.

name: Upload Python Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:


jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
      - name: Create venv
        run: |
          uv venv
      - name: Install package with test extras
        run: |
          uv pip install -e ".[dev]"
      - name: Lint with pre-commit
        run: |
          uvx pre-commit run --all-files
      - name: Test with pytest
        run: |
          uv run pytest
      - name: Verify dependency metadata
        run: |
          uv run pytest tests/package_dependencies_test.py
      - name: Build package
        run: |
          uv build

  publish:
    needs: tests
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
      - name: Create venv and build
        run: |
          uv venv
          uv pip install -e ".[tests]"
          uv build
      - name: Publish
        run: uv publish -t ${{ secrets.PYPI_API_TOKEN }}
