name: Python application

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HYPOTHESIS_PROFILE: ci
  PYTHONHASHSEED: "0"
  # Environments are explicitly installed per job; do not resync away extras.
  UV_NO_SYNC: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv
      - run: uv pip install -e ".[tests]" mypy
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uvx pre-commit run --all-files
      - name: Strict types at compiler phase boundaries
        run: uv run mypy --strict --follow-imports=silent --ignore-missing-imports aeon/compilation/session.py aeon/compilation/interface.py aeon/verification/state.py aeon/sugar/name_resolution.py

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv
      - run: uv pip install -e ".[tests]"
      - run: uv run python scripts/run_core_tests.py -q --junitxml=core-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-results-${{ matrix.python-version }}
          path: core-results.xml

  full-suite:
    runs-on: ubuntu-latest
    # Instrumented research/library tests can be much slower than the core gate.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - name: Full suite and trusted-core coverage
        run: uv run pytest -q -n 4 --dist worksteal --cov=aeon.compilation --cov=aeon.core --cov=aeon.typechecking --cov=aeon.verification --cov-report=xml --cov-report=term --junitxml=full-results.xml --durations=20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-suite-results
          path: |
            full-results.xml
            coverage.xml

  optional-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [ortools, torch]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv
      - run: uv pip install -e ".[tests]"
      - if: matrix.backend == 'ortools'
        run: |
          uv pip install -e ".[synthesis-ortools]"
          uv run pytest tests/ortools_cpsat_test.py -q --junitxml=optional-results.xml
      - if: matrix.backend == 'torch'
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv run pytest tests/nn_bindings_test.py -q --junitxml=optional-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-results-${{ matrix.backend }}
          path: optional-results.xml

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv build
      - name: Install wheel into a clean environment
        run: |
          uv venv /tmp/aeon-wheel-env
          uv pip install --python /tmp/aeon-wheel-env/bin/python dist/*.whl
          /tmp/aeon-wheel-env/bin/python scripts/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: bash run_examples.sh

  research:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HYPOTHESIS_PROFILE: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest tests/core_properties_test.py tests/dace_test.py tests/csg_benchmark_test.py -q --durations=30 --junitxml=research-results.xml
      - name: Compiler performance samples (not synthesis timings)
        run: uv run python scripts/benchmark_compilation.py --repeats 3 examples/syntax/maxI.ae examples/verification/horn_tournament.ae > compiler-timings.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-results
          path: |
            research-results.xml
            compiler-timings.json
